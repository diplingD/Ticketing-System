# each second Prometheus is watching how many API calls, and DB connections there were
global:
  scrape_interval: 1s

scrape_configs:
  - job_name: api
    # Finds every API instance behind the name "api" (one with 1 instance, two with --scale api=2)
    # and scrapes each one separately: GET http://<instance IP>:8080/metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]   # database metrics, collected by postgres-exporter

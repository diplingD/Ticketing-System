services:
  db:
    image: postgres:16
    container_name: ticketing-db
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      # host:container — mapping the port on my PC (5433) to the port on container (5432) because postgess is listening on 5432 (and we can't change that here)
      # host port comes from .env (DB_HOST_PORT), defaults to 5432.
      # On my PC 5432 is taken by a local Postgres, so .env sets it to 5433.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # No container_name: it must be unique, so it would block "docker compose up -d --scale api=2".
  # Docker names the instances ticketingsystem-api-1, -2, ...
  api:
    build: ./src/Ticketing.Api
    environment:
      # Overrides the "Db" connection string; inside the Docker network the database is "db:5432".
      # Maximum Pool Size = max DB connections this API instance opens (Npgsql default 100). Switch without rebuilding:
      #   $env:DB_POOL_SIZE="20"; docker compose up -d
      # Host = where the API connects: db (directly to Postgres, default) or pgbouncer (through the pooler):
      #   $env:DB_HOST="pgbouncer"; docker compose up -d --scale api=2
      ConnectionStrings__Db: "Host=${DB_HOST:-db};Port=5432;Database=ticketing;Username=ticketing;Password=ticketing;Maximum Pool Size=${DB_POOL_SIZE:-100}"
      # Which purchase implementation to run (Naive, ForUpdate, Atomic, Optimistic, OptimisticRetry). Switch without rebuilding:
      #   $env:PURCHASE_STRATEGY="ForUpdate"; docker compose up -d
      Purchase__Strategy: ${PURCHASE_STRATEGY:-Naive}
    ports:
      - "8080-8081:8080"   # a port range: with --scale api=2 the first instance gets 8080, the second 8081
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2"   # Phase 2: was 0.5, the API CPU was the bottleneck for reads
          memory: 256M

  # Connection pooler between the API and Postgres. The API instances open many cheap connections to PgBouncer;
  # PgBouncer keeps only DEFAULT_POOL_SIZE real connections to Postgres and lends them out per transaction.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: ticketing-pgbouncer
    environment:
      DATABASE_URL: "postgres://ticketing:ticketing@db:5432/ticketing"
      AUTH_TYPE: scram-sha-256   # same as Postgres 16
      POOL_MODE: transaction     # a real connection is held only for one transaction, then given to someone else
      MAX_CLIENT_CONN: 1000      # connections the API instances may open to PgBouncer (cheap, no Postgres process)
      DEFAULT_POOL_SIZE: 20      # real connections PgBouncer opens to Postgres (well below ~96)
    depends_on:
      db:
        condition: service_healthy

  # Collects metrics: every scrape_interval it calls /metrics on each target and stores the time series.
  # UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ticketing-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  # Exposes database-side metrics (connections by state, locks, max_connections...) on :9187/metrics.
  # Prometheus scrapes it like the API
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ticketing-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://ticketing:ticketing@db:5432/ticketing?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  # Dashboards on top of Prometheus. UI: http://localhost:3000 (login admin / admin, "Skip" the password change).
  grafana:
    image: grafana/grafana:11.4.0
    container_name: ticketing-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Load testing tool. The "tools" profile keeps it out of "docker compose up";
  # it runs only on demand: docker compose run --rm k6 run /scripts/purchase.js
  k6:
    image: grafana/k6:1.0.0
    profiles: ["tools"]
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      - api

volumes:
  pgdata:
